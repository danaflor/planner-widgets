<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clock • Stopwatch • Timer</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #fff;
        font-family: system-ui, Segoe UI, Inter, Roboto, sans-serif;
      }
      .wrap {
        max-width: 820px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .headline {
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.05;
        margin: 0 0 6px;
      }
      .date {
        font-size: 56px;
      }
      .time {
        font-size: 22px;
        opacity: 0.85;
        margin-bottom: 12px;
      }

      .widget {
        display: grid;
        gap: 24px;
        grid-template-columns: 1fr min(380px, 45%);
        align-items: center;
      }
      @media (max-width: 860px) {
        .widget {
          grid-template-columns: 1fr;
        }
      }

      /* Analog clock */
      .analog {
        width: 100%;
        aspect-ratio: 1/1;
        background: #f6f7f1;
        border-radius: 16px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        position: relative;
      }
      .tick {
        stroke: #7b7b7b;
        stroke-width: 1.5;
      }
      .tick--minor {
        opacity: 0.6;
        stroke-width: 1.5;
      }
      .hand {
        stroke: #444;
        stroke-linecap: round;
        transform-origin: 50% 50%;
      }
      .hand--hour {
        stroke-width: 6;
      }
      .hand--min {
        stroke-width: 5;
      }
      .hand--sec {
        stroke: #d05;
        stroke-width: 2.5;
      }
      .hub {
        fill: #333;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tabs button {
        background: transparent;
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.5);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
      }
      .tabs button.active {
        background: #fff;
        color: #111;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }

      /* Stopwatch + Timer display */
      .big {
        font-size: 42px;
        letter-spacing: 0.03em;
        font-weight: 800;
        margin: 10px 0 14px;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        background: #2a2a2a;
        border: 1px solid #444;
        color: #fff;
      }
      .btn.primary {
        background: #4cc0ff;
        color: #00111a;
        border-color: #4cc0ff;
      }
      .btn.red {
        background: #ff6b6b;
        border-color: #ff6b6b;
        color: #230000;
      }
      .muted {
        opacity: 0.75;
      }

      .timer-set {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .timer-set input {
        width: 90px;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px 10px;
        font-weight: 700;
        text-align: right;
      }

      /* Pill (optional if you want a compact header above the analog) */
      .pill {
        display: inline-block;
        padding: 10px 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pill">
        <span id="dateTxt"></span> • <span id="timeTxt"></span>
      </div>

      <div class="widget">
        <!-- Left: big date + tabs + controls -->
        <div>
          <h1 class="headline date" id="dateLarge">Fri 26 Sept</h1>
          <div class="time" id="timeLarge">11:06:05</div>

          <div class="tabs">
            <button class="tab active" data-tab="clock">Clock</button>
            <button class="tab" data-tab="stopwatch">Stopwatch</button>
            <button class="tab" data-tab="timer">Timer</button>
          </div>

          <!-- CLOCK (nothing extra, just shown for parity) -->
          <div class="panel active" id="panel-clock">
            <p class="muted">Analog + digital time above.</p>
          </div>

          <!-- STOPWATCH -->
          <div class="panel" id="panel-stopwatch">
            <div class="big" id="swDisplay">00:00.00</div>
            <div class="controls">
              <button class="btn primary" id="swStart">Start</button>
              <button class="btn" id="swPause">Pause</button>
              <button class="btn red" id="swReset">Reset</button>
            </div>
          </div>

          <!-- TIMER -->
          <div class="panel" id="panel-timer">
            <div class="timer-set">
              <label>Minutes:</label
              ><input id="tmMin" type="number" min="0" value="25" />
              <label>Seconds:</label
              ><input id="tmSec" type="number" min="0" max="59" value="0" />
            </div>
            <div class="big" id="tmDisplay">25:00</div>
            <div class="controls">
              <button class="btn primary" id="tmStart">Start</button>
              <button class="btn" id="tmPause">Pause</button>
              <button class="btn red" id="tmReset">Reset</button>
            </div>
            <p class="muted">When the timer ends, you’ll get a beep.</p>
          </div>
        </div>

        <!-- Right: Analog clock -->
        <div class="analog">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- ticks -->
            <g>
              <!-- 12 major ticks -->
              <g id="majTicks"></g>
              <!-- 60 minor ticks -->
              <g id="minTicks"></g>
            </g>
            <!-- hands -->
            <line
              id="hHand"
              class="hand hand--hour"
              x1="50"
              y1="50"
              x2="50"
              y2="30"
            />
            <line
              id="mHand"
              class="hand hand--min"
              x1="50"
              y1="50"
              x2="50"
              y2="18"
            />
            <line
              id="sHand"
              class="hand hand--sec"
              x1="50"
              y1="52"
              x2="50"
              y2="16"
            />
            <circle class="hub" cx="50" cy="50" r="1.8" />
          </svg>
        </div>
      </div>
    </div>

    <script>
      /* ---------- Helpers: date/time formatting ---------- */
      function fmtDate(d) {
        // e.g., "Fri 26 Sept"
        return d.toLocaleDateString(undefined, {
          weekday: "short",
          day: "2-digit",
          month: "short",
        });
      }
      function fmtTime(d) {
        return d.toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      /* ---------- Live clock + analog hands ---------- */
      const dateTxt = document.getElementById("dateTxt");
      const timeTxt = document.getElementById("timeTxt");
      const dateLarge = document.getElementById("dateLarge");
      const timeLarge = document.getElementById("timeLarge");

      const hHand = document.getElementById("hHand");
      const mHand = document.getElementById("mHand");
      const sHand = document.getElementById("sHand");

      function tickClock() {
        const now = new Date();
        dateTxt.textContent = fmtDate(now);
        timeTxt.textContent = fmtTime(now);
        dateLarge.textContent = fmtDate(now);
        timeLarge.textContent = fmtTime(now);

        const sec = now.getSeconds() + now.getMilliseconds() / 1000;
        const min = now.getMinutes() + sec / 60;
        const hrs = (now.getHours() % 12) + min / 60;

        const secDeg = sec * 6; // 360/60
        const minDeg = min * 6; // 360/60
        const hrDeg = hrs * 30; // 360/12

        sHand.setAttribute("transform", `rotate(${secDeg} 50 50)`);
        mHand.setAttribute("transform", `rotate(${minDeg} 50 50)`);
        hHand.setAttribute("transform", `rotate(${hrDeg} 50 50)`);
      }
      setInterval(tickClock, 1000);
      tickClock();

      /* ---------- Build ticks (once) ---------- */
      (function buildTicks() {
        const majParent = document.getElementById("majTicks");
        const minParent = document.getElementById("minTicks");

        for (let i = 0; i < 60; i++) {
          const len = i % 5 === 0 ? 6 : 3.2;
          const cls = i % 5 === 0 ? "tick" : "tick tick--minor";

          const angle = (i * 6 * Math.PI) / 180;
          const r1 = 45; // inner radius
          const r2 = 45 + len; // outer radius

          const x1 = 50 + r1 * Math.sin(angle);
          const y1 = 50 - r1 * Math.cos(angle);
          const x2 = 50 + r2 * Math.sin(angle);
          const y2 = 50 - r2 * Math.cos(angle);

          const el = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );
          el.setAttribute("x1", x1);
          el.setAttribute("y1", y1);
          el.setAttribute("x2", x2);
          el.setAttribute("y2", y2);
          el.setAttribute("class", cls);
          (i % 5 === 0 ? majParent : minParent).appendChild(el);
        }
      })();

      /* ---------- Tabs ---------- */
      const tabs = document.querySelectorAll(".tab");
      const panels = {
        clock: document.getElementById("panel-clock"),
        stopwatch: document.getElementById("panel-stopwatch"),
        timer: document.getElementById("panel-timer"),
      };
      tabs.forEach((btn) => {
        btn.addEventListener("click", () => {
          tabs.forEach((b) => b.classList.remove("active"));
          Object.values(panels).forEach((p) => p.classList.remove("active"));
          btn.classList.add("active");
          panels[btn.dataset.tab].classList.add("active");
        });
      });

      /* ---------- Stopwatch ---------- */
      let swRunning = false,
        swStartTime = 0,
        swElapsed = 0,
        swTimer = null;
      const swDisplay = document.getElementById("swDisplay");
      function fmtSW(ms) {
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const cs = Math.floor((ms % 1000) / 10);
        return `${String(m).padStart(2, "0")}:${String(s).padStart(
          2,
          "0"
        )}.${String(cs).padStart(2, "0")}`;
      }
      function swTick() {
        const now = Date.now();
        swDisplay.textContent = fmtSW(swElapsed + (now - swStartTime));
      }
      document.getElementById("swStart").onclick = () => {
        if (swRunning) return;
        swRunning = true;
        swStartTime = Date.now();
        swTimer = setInterval(swTick, 16);
      };
      document.getElementById("swPause").onclick = () => {
        if (!swRunning) return;
        swRunning = false;
        clearInterval(swTimer);
        swElapsed += Date.now() - swStartTime;
        swDisplay.textContent = fmtSW(swElapsed);
      };
      document.getElementById("swReset").onclick = () => {
        swRunning = false;
        clearInterval(swTimer);
        swElapsed = 0;
        swDisplay.textContent = "00:00.00";
      };

      /* ---------- Timer ---------- */
      let tmRunning = false,
        tmEnd = 0,
        tmLeft = 0,
        tmInt = null;
      const tmMin = document.getElementById("tmMin");
      const tmSec = document.getElementById("tmSec");
      const tmDisplay = document.getElementById("tmDisplay");

      function fmtTM(ms) {
        ms = Math.max(0, ms);
        const s = Math.ceil(ms / 1000);
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
      }
      function timerTick() {
        const left = tmEnd - Date.now();
        tmLeft = left;
        tmDisplay.textContent = fmtTM(left);
        if (left <= 0) {
          stopTimer();
          beep();
        }
      }
      function startTimer() {
        const totalMs =
          (Number(tmMin.value || 0) * 60 + Number(tmSec.value || 0)) * 1000;
        if (totalMs <= 0) return;
        tmRunning = true;
        tmEnd = Date.now() + totalMs;
        tmInt = setInterval(timerTick, 200);
        timerTick();
      }
      function pauseTimer() {
        if (!tmRunning) return;
        clearInterval(tmInt);
        tmRunning = false;
        tmLeft = tmEnd - Date.now();
      }
      function stopTimer() {
        clearInterval(tmInt);
        tmRunning = false;
        tmLeft = 0;
        tmDisplay.textContent = fmtTM(0);
      }
      function resetTimer() {
        pauseTimer();
        tmDisplay.textContent = fmtTM(
          (Number(tmMin.value || 0) * 60 + Number(tmSec.value || 0)) * 1000
        );
      }
      document.getElementById("tmStart").onclick = () =>
        tmRunning ? null : startTimer();
      document.getElementById("tmPause").onclick = () => pauseTimer();
      document.getElementById("tmReset").onclick = () => resetTimer();

      /* Initialize timer display to inputs */
      resetTimer();

      /* Beep using WebAudio (no external files) */
      function beep() {
        try {
          const actx = new (window.AudioContext || window.webkitAudioContext)();
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = "sine";
          o.frequency.value = 880;
          o.connect(g);
          g.connect(actx.destination);
          g.gain.setValueAtTime(0.001, actx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
          o.start();
          o.stop(actx.currentTime + 0.4);
        } catch (e) {
          alert("Timer finished!");
        }
      }
    </script>
  </body>
</html>
